[package]
name = "figment-frameshare"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native frame-sharing addon for Figment: Syphon (macOS) now, Spout (Windows) planned."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi8"] }
napi-derive = "2"

[build-dependencies]
napi-build = "2"
cc = "1"

[profile.release]
lto = true
strip = "symbols"
